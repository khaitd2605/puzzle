<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bầy Gián</title>
<style>
  :root {
    --ink: #1a140e;
    --moss: #9aa07f;
    --cream: #f0ead9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #6f7358;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 150px 45px rgba(15, 12, 6, 0.8);
  }
  #stage { width: 100%; max-width: 860px; padding: 8px; }
  svg { display: block; width: 100%; height: auto; }

  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 5;
    flex-wrap: wrap;
  }
  .hud a, .hud button, .hud .stat {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .hud .stat { cursor: default; }

  .roach { transition: transform 0.16s ease-out, opacity 0.3s; will-change: transform; }
  .r-inner { transition: transform 0.16s ease-out; transform-box: fill-box; transform-origin: center; }
  .roach.fall { transition: transform 0.3s ease-in, opacity 0.3s; opacity: 0; }
  #arrow-tile .body { transform-box: fill-box; transform-origin: center; }
  #arrow-tile.stamp .body { animation: stamp 0.18s ease-out; }
  @keyframes stamp {
    0% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  #arrow-tile.bump { animation: bump 0.18s ease-out; }
  @keyframes bump {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(15, 12, 6, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 14px;
    padding: 36px 48px;
    text-align: center;
    animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #overlay h1 { font-size: 30px; margin-bottom: 8px; }
  #overlay p { font-size: 17px; margin-bottom: 20px; }
  #overlay button {
    font: inherit; font-weight: 600;
    padding: 8px 18px;
    border: 3px solid var(--ink); border-radius: 10px;
    background: white; cursor: pointer;
  }
</style>
</head>
<body>

<div class="hud">
  <a href="index.html">🏠 Menu</a>
  <button id="btn-undo">↩ Undo</button>
  <button id="btn-reset">⟲ Reset</button>
  <div class="stat">Nước: <span id="move-count">0</span></div>
  <div class="stat">🪳 <span id="left-count">6</span></div>
</div>

<div id="stage">
  <svg id="scene" viewBox="0 0 720 640"></svg>
</div>

<div id="overlay">
  <div class="card">
    <h1>🪳 Sạch bóng lũ gián!</h1>
    <p>Anh lùa hết <b>6</b> con xuống hang trong <b><span id="final-moves">0</span></b> lần đặt đá (tối thiểu: 36)</p>
    <button id="btn-again">Chơi lại</button>
  </div>
</div>

<script>
(() => {
  const SVG = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const INSTANT = location.hash === '#autotest';

  // ---- Level data (grid 8 cols x 7 rows, cell = row*8+col) ----
  const W = 8, H = 7, CELL = 80, OX = 40, OY = 40;
  const OBST = new Set([
    0, 1, 8, 9,          // stone, top-left 2x2
    12, 13, 14, 20, 21, 22, // wood pile 3x2
    40, 41, 48, 49,      // stone, bottom-left 2x2
    43, 44, 51, 52,      // stone, bottom-middle 2x2
  ]);
  const HOLE = 3;
  const START_ARROW = 32;
  const START_ROACHES = [17, 25, 34, 36, 38, 46];

  const cx = p => OX + (p % 8) * CELL + CELL / 2;
  const cy = p => OY + ((p / 8) | 0) * CELL + CELL / 2;
  const inB = (p, d) => {
    const r = (p / 8) | 0, c = p % 8;
    return d === -8 ? r > 0 : d === 8 ? r < H - 1 : d === -1 ? c > 0 : c < W - 1;
  };

  function el(name, attrs, parent = scene) {
    const e = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  }
  const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

  // ---- Background: mossy ground with soft patches + grid ----
  el('rect', { x: 0, y: 0, width: 720, height: 640, fill: 'var(--moss)' });
  for (let i = 0; i < 26; i++) {
    el('ellipse', {
      cx: rnd(i * 3 + 1) * 720, cy: rnd(i * 7 + 2) * 640,
      rx: 40 + rnd(i + 3) * 90, ry: 30 + rnd(i + 4) * 60,
      fill: i % 3 ? 'rgba(120,118,84,0.25)' : 'rgba(160,162,130,0.3)',
    });
  }
  for (let c = 0; c <= W; c++)
    el('line', { x1: OX + c * CELL, y1: OY, x2: OX + c * CELL, y2: OY + H * CELL, stroke: 'rgba(30,25,10,0.18)', 'stroke-width': 2 });
  for (let r = 0; r <= H; r++)
    el('line', { x1: OX, y1: OY + r * CELL, x2: OX + W * CELL, y2: OY + r * CELL, stroke: 'rgba(30,25,10,0.18)', 'stroke-width': 2 });

  // ---- Hole ----
  el('ellipse', { cx: cx(HOLE), cy: cy(HOLE), rx: 22, ry: 18, fill: '#0b0805' });

  // ---- Stones (irregular polygons over their 2x2 bounding boxes) ----
  function stone(cellTL, seed) {
    const x0 = OX + (cellTL % 8) * CELL, y0 = OY + ((cellTL / 8) | 0) * CELL;
    const cxm = x0 + CELL, cym = y0 + CELL;         // center of the 2x2 block
    const pts = [];
    const nPts = 8;
    for (let i = 0; i < nPts; i++) {
      const a = (i / nPts) * Math.PI * 2 + rnd(seed + i) * 0.3;
      const rad = CELL * (0.78 + rnd(seed + i + 10) * 0.16);
      pts.push([cxm + rad * Math.cos(a), cym + rad * Math.sin(a) * 0.92]);
    }
    const d = 'M ' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L ') + ' Z';
    el('path', { d, fill: '#b9b7ad', stroke: 'var(--ink)', 'stroke-width': 5, 'stroke-linejoin': 'round' });
    // inner facet
    const d2 = 'M ' + pts.slice(0, 5).map(([x, y]) =>
      `${(cxm + (x - cxm) * 0.62).toFixed(1)},${(cym + (y - cym) * 0.62 - 8).toFixed(1)}`).join(' L ');
    el('path', { d: d2, fill: 'none', stroke: 'rgba(255,255,255,0.55)', 'stroke-width': 4, 'stroke-linecap': 'round' });
  }
  stone(0, 5); stone(40, 11); stone(43, 23);

  // ---- Wood pile (3 planks over cols 4-6, rows 1-2) ----
  (function wood() {
    const x0 = OX + 4 * CELL, y0 = OY + 1 * CELL;
    const planks = [
      { x: x0 + 6, y: y0 + 2, w: 3 * CELL - 18, h: 42, rot: -1.5 },
      { x: x0 - 2, y: y0 + 52, w: 3 * CELL - 4, h: 44, rot: 0.8 },
      { x: x0 + 2, y: y0 + 104, w: 3 * CELL - 10, h: 46, rot: -0.6 },
    ];
    planks.forEach((p, i) => {
      const g = el('g', { transform: `rotate(${p.rot} ${p.x + p.w / 2} ${p.y + p.h / 2})` });
      el('rect', { x: p.x, y: p.y, width: p.w, height: p.h, rx: 4, fill: '#cfa768', stroke: 'var(--ink)', 'stroke-width': 5 }, g);
      for (let k = 0; k < 3; k++) {
        const gy = p.y + 10 + k * 12 + rnd(i * 7 + k) * 6;
        el('path', {
          d: `M ${p.x + 12} ${gy} q ${p.w * 0.3} ${rnd(i + k) * 8 - 4} ${p.w * 0.55} 0 t ${p.w * 0.3} ${rnd(i + k + 3) * 6 - 3}`,
          fill: 'none', stroke: 'rgba(80,50,20,0.5)', 'stroke-width': 2.5,
        }, g);
      }
    });
    // little branch stub on top like the photo
    el('line', { x1: x0 + 2.1 * CELL, y1: y0 + 6, x2: x0 + 2.35 * CELL, y2: y0 - 26, stroke: 'var(--ink)', 'stroke-width': 8, 'stroke-linecap': 'round' });
  })();

  // ---- Roaches ----
  function roachSVG(g, seed) {
    const rot = rnd(seed) * 360;
    const inner = el('g', { class: 'r-inner' }, g);
    inner.style.transform = `rotate(${rot}deg)`;
    inner.dataset.angle = rot;
    // legs
    for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
      const y = -12 + i * 12;
      el('path', {
        d: `M 0 ${y} q ${14 * s} ${-4} ${22 * s} ${y < 0 ? -8 : 8}`,
        fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3, 'stroke-linecap': 'round',
      }, inner);
    }
    // antennae
    for (const s of [-1, 1])
      el('path', { d: `M ${4 * s} -18 q ${8 * s} -12 ${14 * s} -20`, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, inner);
    // body
    el('ellipse', { cx: 0, cy: 0, rx: 13, ry: 20, fill: '#8a4a3f', stroke: 'var(--ink)', 'stroke-width': 4 }, inner);
    el('ellipse', { cx: 0, cy: -12, rx: 8, ry: 7, fill: '#5f2f28', stroke: 'var(--ink)', 'stroke-width': 3 }, inner);
    for (let i = 0; i < 3; i++)
      el('line', { x1: -9, y1: -2 + i * 7, x2: 9, y2: -2 + i * 7, stroke: 'rgba(30,10,5,0.6)', 'stroke-width': 2 }, inner);
    return inner;
  }
  // rotate a roach to face its movement direction, taking the shortest arc
  function face(inner, d) {
    const target = d === -8 ? 0 : d === 1 ? 90 : d === 8 ? 180 : 270;
    const cur = parseFloat(inner.dataset.angle);
    let delta = ((target - cur) % 360 + 540) % 360 - 180;
    const next = cur + delta;
    inner.dataset.angle = next;
    inner.style.transform = `rotate(${next}deg)`;
  }

  // ---- Arrow tile ----
  function arrowTileSVG(g) {
    const pts = [];
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + rnd(i + 40) * 0.4;
      pts.push([Math.cos(a) * 30, Math.sin(a) * 30]);
    }
    el('path', {
      d: 'M ' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L ') + ' Z',
      fill: 'var(--cream)', stroke: 'var(--ink)', 'stroke-width': 5, 'stroke-linejoin': 'round',
    }, g);
    // 4-direction arrows (up/down/left/right)
    for (const a of [0, 90, 180, 270]) {
      el('path', {
        d: 'M 0 0 L 0 -17 M -5 -12 L 0 -17 L 5 -12',
        fill: 'none', stroke: '#a08a5f', 'stroke-width': 4, 'stroke-linecap': 'round',
        transform: `rotate(${a})`,
      }, g);
    }
  }

  // ---- Game state ----
  let arrow, roaches, moves, history;
  const moveCountEl = document.getElementById('move-count');
  const leftCountEl = document.getElementById('left-count');
  const finalMovesEl = document.getElementById('final-moves');
  const overlay = document.getElementById('overlay');

  const roachEls = {}, roachInner = {}; // id -> outer g / rotating inner g
  START_ROACHES.forEach((p, i) => {
    const g = el('g', { class: 'roach' });
    roachInner[i] = roachSVG(g, i * 13 + 2);
    roachEls[i] = g;
  });
  const arrowEl = el('g', { id: 'arrow-tile' });
  const arrowBody = el('g', { class: 'body' }, arrowEl);
  arrowTileSVG(arrowBody);

  function render() {
    arrowEl.setAttribute('style', `transform: translate(${cx(arrow)}px, ${cy(arrow)}px)`);
    for (const [id, g] of Object.entries(roachEls)) {
      const r = roaches.find(r => r.id === +id);
      if (r) {
        g.style.display = '';
        g.classList.remove('fall');
        g.style.transform = `translate(${cx(r.pos)}px, ${cy(r.pos)}px)`;
      } else if (!g.classList.contains('fall')) {
        g.style.display = 'none';
      }
    }
    moveCountEl.textContent = moves;
    leftCountEl.textContent = roaches.length;
  }

  function reset() {
    arrow = START_ARROW;
    roaches = START_ROACHES.map((p, i) => ({ id: i, pos: p }));
    moves = 0;
    history = [];
    overlay.classList.remove('show');
    for (const g of Object.values(roachEls)) { g.classList.remove('fall'); g.style.opacity = ''; }
    render();
  }

  // ---- Core move logic (mirrors the verified solver) ----
  // Place the stone on a free cell; every orthogonally adjacent roach
  // is pushed 1 cell AWAY from that cell. Blocked roaches stay.
  function placeStone(target) {
    if (overlay.classList.contains('show')) return false;
    if (target === arrow || target === HOLE || OBST.has(target)) return false;
    if (roaches.some(r => r.pos === target)) return false;

    const newPos = new Map(roaches.map(r => [r.id, r.pos]));
    const fell = [];
    const occupied = p => [...newPos.values()].includes(p);
    for (const d of [-8, 8, -1, 1]) {
      if (!inB(target, d)) continue;
      const m = roaches.find(r => r.pos === target + d);
      if (!m) continue;
      if (!inB(m.pos, d)) continue;          // pushed off the edge -> stays
      const t = m.pos + d;                    // away from the stone
      if (t === HOLE) { newPos.delete(m.id); fell.push(m.id); face(roachInner[m.id], d); continue; }
      if (OBST.has(t) || occupied(t)) continue;
      newPos.set(m.id, t);
      face(roachInner[m.id], d);
    }

    // commit
    history.push({ arrow, roaches: roaches.map(r => ({ ...r })), moves });
    arrow = target;
    if (!INSTANT) {
      arrowEl.classList.remove('stamp');
      void arrowEl.getBoundingClientRect();
      arrowEl.classList.add('stamp');
    }
    roaches = roaches.filter(r => newPos.has(r.id)).map(r => ({ id: r.id, pos: newPos.get(r.id) }));
    moves++;

    // animate fallers into the hole
    for (const id of fell) {
      const g = roachEls[id];
      g.classList.add('fall');
      g.style.transform = `translate(${cx(HOLE)}px, ${cy(HOLE)}px) scale(0.15)`;
      const gg = g;
      setTimeout(() => { if (gg.classList.contains('fall')) gg.style.display = 'none'; }, INSTANT ? 0 : 320);
    }
    render();
    if (roaches.length === 0) {
      finalMovesEl.textContent = moves;
      if (INSTANT) overlay.classList.add('show');
      else setTimeout(() => overlay.classList.add('show'), 600);
    }
    return true;
  }

  function bump() {
    arrowEl.classList.remove('bump');
    void arrowEl.getBoundingClientRect();
    arrowEl.classList.add('bump');
  }

  function undo() {
    if (!history.length || overlay.classList.contains('show')) return;
    const s = history.pop();
    arrow = s.arrow;
    roaches = s.roaches;
    moves = s.moves;
    render();
  }

  // ---- Input: tap/click a cell to place the stone there ----
  scene.style.cursor = 'pointer';
  scene.addEventListener('click', e => {
    const pt = scene.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const { x, y } = pt.matrixTransform(scene.getScreenCTM().inverse());
    const c = Math.floor((x - OX) / CELL), r = Math.floor((y - OY) / CELL);
    if (c < 0 || c >= W || r < 0 || r >= H) return;
    if (!placeStone(r * 8 + c)) bump();
  });

  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-reset').addEventListener('click', reset);
  document.getElementById('btn-again').addEventListener('click', reset);

  reset();

  // ---- self-test: replay the 36-placement optimal solution from the solver ----
  if (INSTANT) {
    const sol = [16,17,27,19,47,46,31,30,29,53,35,27,19,42,25,35,27,19,32,42,25,35,27,19,45,30,29,35,27,19,45,30,29,35,27,19];
    let ok = true;
    for (const s of sol) if (!placeStone(s)) { ok = false; break; }
    document.body.dataset.testResult =
      ok && roaches.length === 0 ? 'WIN moves=' + moves : 'FAIL left=' + roaches.length + ' at=' + moves;
  }
})();
</script>
</body>
</html>
