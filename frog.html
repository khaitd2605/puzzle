<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ếch Qua Đầm</title>
<style>
  :root {
    --ink: #1a140e;
    --water: #c3c6d1;
    --pad: #8aa46a;
    --pad-hl: #a9cc72;
    --cream: #f0ead9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #9ea1ac;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    touch-action: manipulation;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 140px 40px rgba(25, 22, 28, 0.75);
  }
  #stage { width: 100%; max-width: 900px; padding: 8px; }
  svg { display: block; width: 100%; height: auto; }

  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 5;
    flex-wrap: wrap;
  }
  .hud a, .hud button, .hud .stat {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .hud .stat { cursor: default; }

  /* lily pad states */
  .pad { cursor: default; }
  .pad .leaf { transition: fill 0.25s, opacity 0.4s, transform 0.4s; transform-box: fill-box; transform-origin: center; }
  .pad.hl { cursor: pointer; }
  .pad.hl .leaf { fill: var(--pad-hl); animation: padpulse 1.4s ease-in-out infinite; }
  @keyframes padpulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.18); }
  }
  .pad.sunk .leaf { fill: #9a9890; }
  .pad.gone .leaf { opacity: 0; transform: scale(0.75); }
  .goal.hl { cursor: pointer; }
  .goal.hl .rockbody { animation: padpulse 1.4s ease-in-out infinite; }

  #frog { pointer-events: none; }
  #frog .shadow { transition: none; }

  .banner {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 5;
    font-weight: 700;
    font-size: 15px;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 7px 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .banner .dot { opacity: 0.35; }
  .banner .dot.done { opacity: 1; }

  #debug {
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 6;
    background: rgba(20,16,10,0.85);
    color: #cfe8a0;
    font: 12px/1.5 ui-monospace, monospace;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
    max-width: 340px;
  }
  #debug.on { display: block; }
  #debug button {
    font: inherit; margin: 2px; padding: 2px 8px;
    background: #2e2a20; color: #cfe8a0;
    border: 1px solid #cfe8a0; border-radius: 5px; cursor: pointer;
  }
  .coord { font: 11px ui-monospace, monospace; fill: #444; pointer-events: none; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(20, 18, 24, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 14px;
    padding: 36px 48px;
    text-align: center;
    animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #overlay h1 { font-size: 30px; margin-bottom: 8px; }
  #overlay p { font-size: 17px; margin-bottom: 20px; }
  #overlay button {
    font: inherit; font-weight: 600;
    padding: 8px 18px;
    border: 3px solid var(--ink); border-radius: 10px;
    background: white; cursor: pointer;
  }
</style>
</head>
<body>

<div class="hud">
  <a href="index.html">🏠 Menu</a>
  <button id="btn-reset">⟲ Reset màn</button>
  <div class="stat">🐸 Màn <span id="lv-name">A</span></div>
</div>
<div class="banner" id="banner"></div>

<div id="stage">
  <svg id="scene"></svg>
</div>

<div id="debug">
  <div id="dbg-info"></div>
  <div>
    <button data-dbg="step">▶ Step</button>
    <button data-dbg="reset">Reset</button>
    <span id="dbg-levels"></span>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <h1>🐸 Ếch đã về tổ!</h1>
    <p>Anh đã đưa chú ếch qua cả <b>5</b> đầm lầy nguyên bản 👏</p>
    <button id="btn-again">Chơi lại từ đầu</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const SVG = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const INSTANT = location.hash === '#autotest';
  const DEBUG = /[?#&]debug/.test(location.href) || INSTANT;

  // =====================================================================
  // Level data — reconstructed from the original Rusty Lake Paradise
  // "Second Plague" frog puzzle (verified frame-by-frame against the
  // original walkthrough video + the known A–E solutions).
  // Coordinates are [col, row]. goalType 'rock' (A–D) or 'nest' (E).
  // solution entries: [dir, dist] — validated by the autotest.
  // =====================================================================
  const LEVELS = [
    {
      id: 'A', cols: 5, rows: 3,
      start: [3, 2], goal: [0, 0], goalType: 'rock',
      pads: [[2, 0], [3, 0], [4, 0]],
      solution: [['U', 2], ['R', 1], ['L', 2], ['L', 2]],
    },
    {
      id: 'B', cols: 5, rows: 5,
      start: [0, 1], goal: [3, 4], goalType: 'rock',
      pads: [[1, 0], [3, 0], [4, 0], [2, 1], [4, 1], [1, 2], [2, 2], [3, 2], [4, 2], [4, 3]],
      solution: [['R', 2], ['D', 1], ['L', 1], ['U', 2], ['R', 2], ['R', 1], ['D', 1], ['D', 2], ['U', 1], ['L', 1], ['D', 2]],
    },
    {
      id: 'C', cols: 4, rows: 5,
      start: [3, 4], goal: [2, 0], goalType: 'rock',
      pads: [[2, 1], [1, 2], [0, 2], [0, 3], [2, 3], [1, 4], [2, 4]],
      solution: [['L', 1], ['L', 1], ['U', 2], ['L', 1], ['D', 1], ['R', 2], ['U', 2], ['U', 1]],
    },
    {
      id: 'D', cols: 6, rows: 4,
      start: [2, 0], goal: [5, 3], goalType: 'rock',
      pads: [[0, 0], [1, 1], [3, 1], [0, 2], [1, 2], [2, 2], [1, 3], [2, 3], [3, 3]],
      solution: [['L', 2], ['D', 2], ['R', 1], ['R', 1], ['D', 1], ['L', 1], ['U', 2], ['R', 2], ['D', 2], ['R', 2]],
    },
    {
      id: 'E', cols: 6, rows: 4,
      start: [5, 3], goal: [2, 0], goalType: 'nest',
      pads: [[0, 0], [1, 1], [3, 1], [0, 2], [1, 2], [2, 2], [1, 3], [2, 3], [3, 3]],
      solution: [['L', 2], ['U', 2], ['L', 2], ['D', 1], ['D', 1], ['R', 1], ['U', 1], ['L', 2], ['U', 2], ['R', 2]],
    },
  ];
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const CELL = 96, MARGIN = 70;

  function el(name, attrs, parent = scene) {
    const e = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  }
  const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
  const key = (c) => c[0] + ',' + c[1];

  // ---------------------------------------------------------------
  // Visual pieces
  // ---------------------------------------------------------------
  function padSVG(g, seed) {
    // classic two-lobed lily pad: a disc with a wedge notch
    const a0 = rnd(seed) * Math.PI * 2;           // notch direction
    const w = 0.26;                                // notch half-width (rad)
    const r = 34;
    const p1 = [Math.cos(a0 - w) * r, Math.sin(a0 - w) * r];
    const p2 = [Math.cos(a0 + w) * r, Math.sin(a0 + w) * r];
    el('path', {
      class: 'leaf',
      d: `M 0 0 L ${p1[0]} ${p1[1]} A ${r} ${r} 0 1 0 ${p2[0]} ${p2[1]} Z`,
      fill: 'var(--pad)', stroke: 'var(--ink)', 'stroke-width': 4.5,
      'stroke-linejoin': 'round',
    }, g);
    // split line across the middle lobe, like the two-leaved original pads
    const a1 = a0 + Math.PI * (0.72 + rnd(seed + 4) * 0.2);
    el('line', {
      class: 'leaf',
      x1: 0, y1: 0, x2: Math.cos(a1) * r * 0.96, y2: Math.sin(a1) * r * 0.96,
      stroke: 'var(--ink)', 'stroke-width': 3.5, 'stroke-linecap': 'round',
    }, g);
  }
  function rockSVG(g, seed, small) {
    const r = small ? 30 : 36;
    const pts = [];
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + rnd(seed + i) * 0.4;
      pts.push([Math.cos(a) * r * (0.85 + rnd(seed + i + 9) * 0.25),
                Math.sin(a) * r * (0.8 + rnd(seed + i + 5) * 0.2)]);
    }
    el('path', {
      class: 'rockbody',
      d: 'M ' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' L ') + ' Z',
      fill: '#b8b6ae', stroke: 'var(--ink)', 'stroke-width': 4.5, 'stroke-linejoin': 'round',
    }, g);
    el('path', { d: 'M -8 -2 L 8 2 M -1 -8 L 1 8', stroke: '#8d8b83', 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }, g);
  }
  function nestSVG(g) {
    el('circle', { class: 'rockbody', cx: 0, cy: 0, r: 34, fill: '#a9825a', stroke: 'var(--ink)', 'stroke-width': 4.5 }, g);
    el('circle', { cx: 0, cy: 0, r: 22, fill: '#8a6844', stroke: 'var(--ink)', 'stroke-width': 3 }, g);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      el('line', {
        x1: Math.cos(a) * 23, y1: Math.sin(a) * 23,
        x2: Math.cos(a + 0.3) * 33, y2: Math.sin(a + 0.3) * 33,
        stroke: 'rgba(60,40,20,0.55)', 'stroke-width': 3, 'stroke-linecap': 'round',
      }, g);
    }
  }
  function frogSVG(g) {
    const b = el('g', { class: 'fbody' }, g);
    // hind legs
    for (const s of [-1, 1]) {
      el('path', {
        d: `M ${8 * s} 10 q ${12 * s} 2 ${10 * s} 14 q ${-2 * s} 6 ${6 * s} 8`,
        fill: 'none', stroke: '#4d7a2e', 'stroke-width': 7, 'stroke-linecap': 'round',
      }, b);
    }
    // front legs
    for (const s of [-1, 1]) {
      el('path', {
        d: `M ${7 * s} -8 q ${9 * s} -2 ${8 * s} -12`,
        fill: 'none', stroke: '#4d7a2e', 'stroke-width': 5.5, 'stroke-linecap': 'round',
      }, b);
    }
    el('ellipse', { cx: 0, cy: 2, rx: 13, ry: 19, fill: '#69a13c', stroke: 'var(--ink)', 'stroke-width': 3.5 }, b);
    el('path', { d: 'M 0 -14 q -3 12 0 30 M -5 -8 q -2 10 0 22 M 5 -8 q 2 10 0 22', fill: 'none', stroke: 'rgba(30,60,10,0.45)', 'stroke-width': 2 }, b);
    for (const s of [-1, 1]) {
      el('circle', { cx: 6.5 * s, cy: -14, r: 4.5, fill: '#69a13c', stroke: 'var(--ink)', 'stroke-width': 3 }, b);
      el('circle', { cx: 6.5 * s, cy: -14.5, r: 1.6, fill: 'var(--ink)' }, b);
    }
    return b;
  }

  // ---------------------------------------------------------------
  // PuzzleController
  // ---------------------------------------------------------------
  const banner = document.getElementById('banner');
  const overlay = document.getElementById('overlay');
  const lvName = document.getElementById('lv-name');

  const C = {
    li: 0,           // level index
    level: null,
    frogAt: null,    // [c,r]
    visited: null,   // Set of pad keys already left behind
    padEls: null,    // key -> g
    goalEl: null,
    frogEl: null, frogBody: null, frogShadow: null,
    startEl: null,
    busy: false,
    stepIdx: 0,      // debug: solution pointer

    pos(c) { return [MARGIN + c[0] * CELL + CELL / 2, MARGIN + c[1] * CELL + CELL / 2]; },

    loadLevel(i) {
      this.li = i;
      const L = this.level = LEVELS[i];
      this.frogAt = L.start.slice();
      this.visited = new Set();
      this.busy = false;
      this.stepIdx = 0;
      lvName.textContent = L.id;
      banner.innerHTML = LEVELS.map((l, j) =>
        `<span class="dot${j < i ? ' done' : ''}">${j === i ? '🐸' : '●'}</span>`).join(' ');

      scene.innerHTML = '';
      const W = L.cols * CELL + MARGIN * 2, H = L.rows * CELL + MARGIN * 2;
      scene.setAttribute('viewBox', `0 0 ${W} ${H}`);
      // water
      el('rect', { x: 0, y: 0, width: W, height: H, rx: 26, fill: 'var(--water)' });
      for (let k = 0; k < 14; k++) {
        el('ellipse', {
          cx: rnd(k * 3 + 1) * W, cy: rnd(k * 5 + 2) * H,
          rx: 30 + rnd(k + 3) * 70, ry: 20 + rnd(k + 4) * 40,
          fill: k % 2 ? 'rgba(255,255,255,0.16)' : 'rgba(120,125,150,0.12)',
        });
      }

      // pads
      this.padEls = {};
      L.pads.forEach((p, j) => {
        const [x, y] = this.pos(p);
        const g = el('g', { class: 'pad', transform: `translate(${x} ${y})` });
        padSVG(g, i * 31 + j * 7 + 3);
        g.addEventListener('click', () => this.tryJump(p));
        this.padEls[key(p)] = g;
      });

      // goal
      {
        const [x, y] = this.pos(L.goal);
        const g = el('g', { class: 'goal', transform: `translate(${x} ${y})` });
        if (L.goalType === 'nest') nestSVG(g); else rockSVG(g, i * 17 + 5);
        g.addEventListener('click', () => this.tryJump(L.goal));
        this.goalEl = g;
      }

      // start stone
      {
        const [x, y] = this.pos(L.start);
        const g = el('g', { class: 'pad', transform: `translate(${x} ${y})` });
        rockSVG(g, i * 23 + 11, true);
        g.querySelector('.rockbody').setAttribute('class', 'leaf');
        this.startEl = g;
      }

      // debug coordinates
      if (DEBUG) {
        for (let c = 0; c < L.cols; c++) for (let r = 0; r < L.rows; r++) {
          const [x, y] = this.pos([c, r]);
          el('text', { class: 'coord', x: x - 12, y: y - CELL / 2 + 12 }).textContent = c + ',' + r;
        }
      }

      // frog
      this.frogEl = el('g', { id: 'frog' });
      this.frogShadow = el('ellipse', { class: 'shadow', cx: 0, cy: 6, rx: 16, ry: 9, fill: 'rgba(20,20,25,0.25)' }, this.frogEl);
      this.frogBody = frogSVG(this.frogEl);
      this.setFrog(...this.pos(L.start));

      this.updateHighlights();
      this.updateDebug();
    },

    setFrog(x, y) { this.frogEl.setAttribute('transform', `translate(${x} ${y})`); },

    isPad(c) { return this.level.pads.some(p => p[0] === c[0] && p[1] === c[1]); },
    isGoal(c) { return this.level.goal[0] === c[0] && this.level.goal[1] === c[1]; },
    allVisited() {
      return this.level.pads.every(p => this.visited.has(key(p)) || key(p) === key(this.frogAt));
    },

    // valid landing cells from the current position
    validMoves() {
      const out = [];
      for (const [dx, dy] of Object.values(DIRS)) {
        for (let k = 1; k <= 2; k++) {
          const c = [this.frogAt[0] + dx * k, this.frogAt[1] + dy * k];
          if (this.isPad(c) && !this.visited.has(key(c)) && key(c) !== key(this.frogAt)) out.push(c);
          else if (this.isGoal(c) && this.allVisited()) out.push(c);
        }
      }
      return out;
    },

    updateHighlights() {
      for (const g of Object.values(this.padEls)) g.classList.remove('hl');
      this.goalEl.classList.remove('hl');
      for (const c of this.validMoves()) {
        if (this.isGoal(c)) this.goalEl.classList.add('hl');
        else this.padEls[key(c)].classList.add('hl');
      }
    },

    tryJump(c) {
      if (this.busy || overlay.classList.contains('show')) return false;
      const ok = this.validMoves().some(v => v[0] === c[0] && v[1] === c[1]);
      if (!ok) return false;
      this.busy = true;

      const from = this.frogAt.slice();
      const fromEl = key(from) === key(this.level.start) ? this.startEl : this.padEls[key(from)];
      // leaving: previous pad sinks away for good
      if (key(from) !== key(this.level.start)) this.visited.add(key(from));
      this.frogAt = c.slice();

      const done = () => {
        if (fromEl) fromEl.classList.add('gone');
        if (this.isGoal(c)) this.completeLevel();
        else {
          this.padEls[key(c)].classList.add('sunk'); // sinking under the frog
          this.busy = false;
          this.updateHighlights();
        }
        this.updateDebug();
      };

      // clear highlights during flight
      for (const g of Object.values(this.padEls)) g.classList.remove('hl');
      this.goalEl.classList.remove('hl');

      const [x1, y1] = this.pos(from), [x2, y2] = this.pos(c);
      if (INSTANT) { this.setFrog(x2, y2); done(); return true; }

      // face the jump direction (frog art faces up)
      const ang = Math.atan2(x2 - x1, y1 - y2) * 180 / Math.PI;
      this.frogBody.setAttribute('transform', `rotate(${ang})`);

      const dist = Math.hypot(x2 - x1, y2 - y1);
      const dur = 300 + dist * 0.9, hop = dist * 0.36;
      const t0 = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        const e = t;                       // linear ground motion
        const x = x1 + (x2 - x1) * e, y = y1 + (y2 - y1) * e;
        const air = Math.sin(t * Math.PI); // arc
        // squash & stretch: compress at start/end, stretch mid-air
        const sc = 1 + air * 0.25, sq = t < 0.08 || t > 0.92 ? 0.85 : 1;
        this.frogBody.setAttribute('transform', `rotate(${ang}) scale(${sq * sc} ${sq * (2 - sc > 1 ? 1 : 2 - sc)})`);
        this.frogEl.setAttribute('transform', `translate(${x} ${y - air * hop})`);
        this.frogShadow.setAttribute('transform', `translate(0 ${air * hop}) scale(${1 - air * 0.35})`);
        if (t < 1) requestAnimationFrame(step);
        else {
          this.frogBody.setAttribute('transform', `rotate(${ang})`);
          this.frogShadow.setAttribute('transform', '');
          done();
        }
      };
      requestAnimationFrame(step);
      return true;
    },

    completeLevel() {
      const next = () => {
        if (this.li + 1 < LEVELS.length) this.loadLevel(this.li + 1);
        else overlay.classList.add('show');
      };
      if (INSTANT) { next(); return; }
      // little victory hop
      const [x, y] = this.pos(this.level.goal);
      let n = 0;
      const hopTimer = setInterval(() => {
        this.setFrog(x, y - (n % 2 ? 0 : 7));
        if (++n > 3) { clearInterval(hopTimer); setTimeout(next, 500); }
      }, 130);
    },

    reset() { this.loadLevel(this.li); },

    // debug helpers
    stepSolution() {
      const L = this.level;
      if (this.stepIdx >= L.solution.length) return false;
      const [d, k] = L.solution[this.stepIdx];
      const [dx, dy] = DIRS[d];
      const c = [this.frogAt[0] + dx * k, this.frogAt[1] + dy * k];
      const ok = this.tryJump(c);
      // completing a level loads the next one (stepIdx already reset to 0)
      if (ok && this.level === L) this.stepIdx++;
      return ok;
    },
    updateDebug() {
      if (!DEBUG) return;
      document.getElementById('dbg-info').textContent =
        `level=${this.level.id} frog=${key(this.frogAt)} visited=${this.visited.size}/${this.level.pads.length} ` +
        `valid=[${this.validMoves().map(key).join(' ')}] step=${this.stepIdx}/${this.level.solution.length}`;
    },
  };

  document.getElementById('btn-reset').addEventListener('click', () => C.reset());
  document.getElementById('btn-again').addEventListener('click', () => {
    overlay.classList.remove('show');
    C.loadLevel(0);
  });

  // debug panel
  if (DEBUG) {
    const dbg = document.getElementById('debug');
    dbg.classList.add('on');
    const lvBtns = document.getElementById('dbg-levels');
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button');
      b.textContent = L.id;
      b.addEventListener('click', () => C.loadLevel(i));
      lvBtns.appendChild(b);
    });
    dbg.querySelector('[data-dbg=step]').addEventListener('click', () => C.stepSolution());
    dbg.querySelector('[data-dbg=reset]').addEventListener('click', () => C.reset());
  }

  C.loadLevel(0);

  // ---- self-test: replay all five original solutions ----
  if (INSTANT) {
    let ok = true, played = 0;
    outer:
    for (let i = 0; i < LEVELS.length; i++) {
      // loadLevel(i) happens automatically via completeLevel chaining,
      // but validate we are on the expected level
      if (!overlay.classList.contains('show') && C.li !== i) { ok = false; break; }
      const n = LEVELS[i].solution.length;
      for (let s = 0; s < n; s++) {
        if (!C.stepSolution()) { ok = false; break outer; }
      }
      played++;
    }
    document.body.dataset.testResult =
      ok && played === 5 && overlay.classList.contains('show')
        ? 'WIN levels=5'
        : `FAIL level=${C.level.id} step=${C.stepIdx} played=${played}`;
  }
})();
</script>
</body>
</html>
