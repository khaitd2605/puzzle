<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Games</title>
<style>
  :root {
    --cream: #f0ead9;
    --ink: #14110c;
    --shadow: rgba(20, 17, 12, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #e6dfcc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    padding: 24px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    letter-spacing: 2px;
  }
  .games {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    width: 260px;
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 8px 0 var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 0 var(--shadow); }
  .card:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--shadow); }
  .card .icon { font-size: 64px; line-height: 1.3; }
  .card h2 { font-size: 22px; margin: 10px 0 6px; }
  .card p { font-size: 14px; opacity: 0.75; }
</style>
</head>
<body>
  <h1>🧩 PUZZLE GAMES</h1>
  <div class="games">
    <a class="card" href="slide.html">
      <div class="icon">🎯</div>
      <h2>Slide Puzzle</h2>
      <p>Kéo các cục về đúng vị trí được đánh dấu — chúng chỉ dừng khi gặp vật cản.</p>
    </a>
    <a class="card" href="tree.html">
      <div class="icon">🌸</div>
      <h2>Cây Hoa</h2>
      <p>Giúp con ruồi làm cả cây hoa nở. Bí mật nằm ở mấy tấm ván gỗ dưới gốc…</p>
    </a>
  </div>
</body>
</html>
