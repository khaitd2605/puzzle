<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cây Hoa</title>
<style>
  :root {
    --ink: #1a140e;
    --wood: #8d7f6f;
    --branch: #c9a06a;
    --pink: #f2cdd9;
    --cream: #f0ead9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      repeating-linear-gradient(90deg,
        var(--wood) 0 120px, #837565 120px 124px,
        #94867a 124px 250px, #7d7060 250px 254px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 140px 40px rgba(20, 10, 5, 0.75);
  }
  #stage { width: 100%; max-width: 1000px; }
  svg { display: block; width: 100%; height: auto; }

  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 5;
  }
  .hud a, .hud button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 7px 14px;
    border: 3px solid var(--ink);
    border-radius: 10px;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .hud .count {
    font-size: 15px;
    font-weight: 700;
    background: var(--cream);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 7px 14px;
  }
  .levels { display: flex; gap: 6px; }
  .levels button { padding: 7px 12px; opacity: 0.55; }
  .levels button.active { opacity: 1; background: #d9e8b8; }

  .lever { cursor: pointer; }
  .lever .plank {
    transition: transform 0.18s ease-out;
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  #tree { transform-box: view-box; transform-origin: 44% 85%; }
  #tree.shake { animation: treeshake 0.5s ease-out; }
  @keyframes treeshake {
    0% { transform: rotate(0); } 20% { transform: rotate(1.3deg); }
    40% { transform: rotate(-1deg); } 60% { transform: rotate(0.7deg); }
    80% { transform: rotate(-0.4deg); } 100% { transform: rotate(0); }
  }
  #fly { cursor: pointer; }
  #fly.flying { cursor: default; }
  .wing { animation: buzz 0.12s linear infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes buzz { from { transform: rotate(-18deg); } to { transform: rotate(14deg); } }

  .petal, .bud, .bloom-center {
    transition: transform 0.5s cubic-bezier(0.2, 1.5, 0.4, 1), opacity 0.3s;
    transform-box: fill-box;
    transform-origin: center;
  }
  .bloom .bud { transform: scale(0); opacity: 0; }
  .bloom .petal { transform: scale(1) !important; }
  .bloom .bloom-center { transform: scale(1) !important; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(20, 14, 8, 0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    background: var(--cream);
    border: 5px solid var(--ink);
    border-radius: 14px;
    padding: 36px 48px;
    text-align: center;
    animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #overlay h1 { font-size: 30px; margin-bottom: 8px; }
  #overlay p { font-size: 17px; margin-bottom: 20px; }
  #overlay button {
    font: inherit; font-weight: 600;
    padding: 8px 18px;
    border: 3px solid var(--ink); border-radius: 10px;
    background: white; cursor: pointer;
  }
</style>
</head>
<body>

<div class="hud">
  <a href="index.html">🏠 Menu</a>
  <button id="btn-reset">⟲ Reset</button>
  <div class="count">🌸 <span id="bloom-count">0</span>/<span id="bloom-total">7</span></div>
  <div class="levels" id="level-btns"></div>
</div>

<div id="stage">
  <svg id="scene" viewBox="0 0 1000 780"></svg>
</div>

<div id="overlay">
  <div class="card">
    <h1>🌸 Cây đã nở hết hoa!</h1>
    <p>Anh đã tìm ra cả <b><span id="win-count">7</span></b> bí mật của cái cây 👏</p>
    <button id="btn-again">Chơi lại</button>
    <button id="btn-next">Level tiếp →</button>
  </div>
</div>

<script>
(() => {
  const SVG = 'http://www.w3.org/2000/svg';
  const scene = document.getElementById('scene');
  const INSTANT = location.hash === '#autotest';

  // ---- Level data ----
  // Each level = which branch tips (0-15) carry a flower bud.
  const LEVELS = [
    { name: '1', flowers: [3, 6, 9, 12] },
    { name: '2', flowers: [1, 4, 6, 9, 11, 13, 14] },
    { name: '3', flowers: [0, 2, 3, 5, 7, 8, 10, 12, 13, 15] },
  ];
  let levelIdx = 0;
  let FLOWERS = LEVELS[0].flowers;
  const GROUND_Y = 662;
  const TRUNK_X = 440, TRUNK_TOP = 508;
  const HOLE = [TRUNK_X, 600];
  const FLY_HOME = [110, 646];
  const SPREAD = [0.50, 0.40, 0.30, 0.22];   // radians per fork level
  const LEN    = [128, 104, 84, 66];
  const WIDTH  = [19, 12, 7.5, 4.5];

  function el(name, attrs, parent = scene) {
    const e = document.createElementNS(SVG, name);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  }

  // ---- Grow the binary tree: 4 fork levels -> 16 tips ----
  // First fork = most significant bit; bit 0 = left, bit 1 = right.
  // Deterministic jitter + curved branches so the tree reads as organic,
  // not as a textbook binary fan.
  const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
  const segs = [], tips = new Array(16), forks = [];
  (function grow(x, y, angle, level, path, idx) {
    if (level === 4) { tips[idx] = { x, y, angle, path }; return; }
    forks.push({ x, y, angle, level });
    for (const b of [0, 1]) {
      const seed = idx * 37 + level * 11 + b * 53;
      let a = angle + (b ? SPREAD[level] : -SPREAD[level]) + (rnd(seed) - 0.5) * 0.2;
      a = Math.max(-1.32, Math.min(1.32, a));
      const L = LEN[level] * (0.84 + rnd(seed + 1) * 0.32);
      const nx = x + L * Math.sin(a);
      const ny = y - L * Math.cos(a);
      const px = -(ny - y) / L, py = (nx - x) / L;      // unit perpendicular
      const bow = (rnd(seed + 2) - 0.5) * 30;
      segs.push({
        x1: x, y1: y,
        cx: (x + nx) / 2 + px * bow, cy: (y + ny) / 2 + py * bow,
        x2: nx, y2: ny, level,
      });
      grow(nx, ny, a, level + 1, [...path, [nx, ny]], (idx << 1) | b);
    }
  })(TRUNK_X, TRUNK_TOP, 0, 0, [HOLE, [TRUNK_X, TRUNK_TOP]], 0);

  // ---- Draw scene ----
  // ground
  el('rect', { x: 0, y: GROUND_Y, width: 1000, height: 120, fill: '#b6b2a2' });
  el('line', { x1: 0, y1: GROUND_Y, x2: 1000, y2: GROUND_Y, stroke: 'var(--ink)', 'stroke-width': 5 });

  const treeG = el('g', { id: 'tree' });

  // trunk (tapered) + branches: black outline pass, then brown pass
  const trunkD = `M ${TRUNK_X-24},${GROUND_Y+4} C ${TRUNK_X-16},${GROUND_Y-80} ${TRUNK_X-13},${TRUNK_TOP+40} ${TRUNK_X-10},${TRUNK_TOP}
                  L ${TRUNK_X+10},${TRUNK_TOP} C ${TRUNK_X+13},${TRUNK_TOP+40} ${TRUNK_X+16},${GROUND_Y-80} ${TRUNK_X+24},${GROUND_Y+4} Z`;
  for (const pass of ['outline', 'fill']) {
    for (const s of segs) {
      el('path', {
        d: `M ${s.x1} ${s.y1} Q ${s.cx} ${s.cy} ${s.x2} ${s.y2}`,
        fill: 'none',
        stroke: pass === 'outline' ? 'var(--ink)' : 'var(--branch)',
        'stroke-width': WIDTH[s.level] + (pass === 'outline' ? 7 : 0),
        'stroke-linecap': 'round',
      }, treeG);
    }
    el('path', {
      d: trunkD,
      fill: pass === 'outline' ? 'var(--ink)' : 'var(--branch)',
      stroke: pass === 'outline' ? 'var(--ink)' : 'none',
      'stroke-width': 8, 'stroke-linejoin': 'round',
      transform: pass === 'outline' ? '' : 'translate(0 -1)',
    }, treeG);
  }
  // decorative dead twigs at some forks — breaks the symmetric pattern
  for (const f of forks) {
    if (f.level < 1 || rnd(f.x * 3.7 + f.y) < 0.4) continue;
    const a = f.angle + (rnd(f.x + f.y * 2) - 0.5) * 2.4;
    const L = 15 + rnd(f.y + 5) * 14;
    const tx = f.x + L * Math.sin(a), ty = f.y - L * Math.cos(a);
    el('line', { x1: f.x, y1: f.y, x2: tx, y2: ty, stroke: 'var(--ink)', 'stroke-width': 3, 'stroke-linecap': 'round' }, treeG);
    el('ellipse', { cx: tx, cy: ty, rx: 3, ry: 7, fill: 'var(--ink)', transform: `rotate(${a * 57.3} ${tx} ${ty})` }, treeG);
  }
  // hollow
  el('ellipse', { cx: HOLE[0], cy: HOLE[1], rx: 11, ry: 22, fill: '#0a0705', stroke: 'var(--ink)', 'stroke-width': 4 }, treeG);

  // ---- Tips: flowers & leaves ----
  let flowerEls = {}; // tip idx -> group
  const bloomed = new Set();
  let tipGroups = [];
  const leafShape = (g, angle) => {
    for (const side of [-0.5, 0.5]) {
      el('ellipse', {
        cx: 0, cy: -8, rx: 3.2, ry: 8, fill: 'var(--ink)',
        transform: `rotate(${(angle + side) * 57.3} 0 0) translate(0 -2)`,
      }, g);
    }
  };
  function buildTips() {
    for (const g of tipGroups) g.remove();
    tipGroups = [];
    flowerEls = {};
    for (let i = 0; i < 16; i++) {
      const t = tips[i];
      const g = el('g', { transform: `translate(${t.x} ${t.y})` }, treeG);
      tipGroups.push(g);
      if (FLOWERS.includes(i)) {
        const fg = el('g', { transform: `rotate(${t.angle * 57.3})` }, g);
        // petals (hidden until bloom) — rotation lives on a wrapper group so
        // the scale animation on the petal itself doesn't override it
        for (let p = 0; p < 6; p++) {
          const pg = el('g', { transform: `rotate(${p * 60})` }, fg);
          el('ellipse', {
            class: 'petal', cx: 0, cy: -14, rx: 7.5, ry: 14,
            fill: 'var(--pink)', stroke: 'var(--ink)', 'stroke-width': 3,
            style: 'transform:scale(0)',
          }, pg);
        }
        el('circle', {
          class: 'bloom-center', cx: 0, cy: 0, r: 6.5,
          fill: '#f7e8a0', stroke: 'var(--ink)', 'stroke-width': 3,
          style: 'transform:scale(0)',
        }, fg);
        // bud
        el('ellipse', {
          class: 'bud', cx: 0, cy: -12, rx: 7.5, ry: 14,
          fill: 'var(--pink)', stroke: 'var(--ink)', 'stroke-width': 4,
        }, fg);
        flowerEls[i] = fg;
      } else {
        leafShape(g, t.angle);
      }
    }
  }
  buildTips();

  // ---- Levers (4 bits, MSB leftmost; left = 0, right = 1) ----
  const bits = [0, 0, 0, 0];
  const leverEls = [];
  for (let i = 0; i < 4; i++) {
    const x = 690 + i * 72;
    const g = el('g', { class: 'lever', transform: `translate(${x} ${GROUND_Y})` });
    const plank = el('g', { class: 'plank' }, g);
    el('rect', {
      x: -11, y: -86, width: 22, height: 88, rx: 3,
      fill: '#a08770', stroke: 'var(--ink)', 'stroke-width': 4,
    }, plank);
    el('path', { // small arrow
      d: 'M 0,-66 L 0,-34 M -6,-58 L 0,-66 L 6,-58',
      fill: 'none', stroke: '#6e5c48', 'stroke-width': 4, 'stroke-linecap': 'round',
    }, plank);
    // generous invisible hit area
    el('rect', { x: -34, y: -110, width: 68, height: 114, fill: 'transparent' }, g);
    leverEls.push(plank);
    g.addEventListener('click', () => {
      bits[i] ^= 1;
      renderLevers();
    });
  }
  function renderLevers() {
    bits.forEach((b, i) => {
      leverEls[i].style.transform = `rotate(${b ? 24 : -24}deg)`;
    });
  }
  renderLevers();
  const leverValue = () => (bits[0] << 3) | (bits[1] << 2) | (bits[2] << 1) | bits[3];

  // ---- Fly ----
  const fly = el('g', { id: 'fly' });
  el('circle', { cx: 0, cy: 0, r: 26, fill: 'transparent' }, fly); // hit area
  el('ellipse', { cx: 0, cy: 0, rx: 10, ry: 7, fill: 'var(--ink)' }, fly);
  el('circle', { cx: 9, cy: -3, r: 4.5, fill: 'var(--ink)' }, fly);
  el('ellipse', { class: 'wing', cx: -3, cy: -9, rx: 10, ry: 4.5, fill: 'rgba(240,240,255,0.75)', stroke: 'var(--ink)', 'stroke-width': 1.5 }, fly);
  const setFly = (x, y) => fly.setAttribute('transform', `translate(${x} ${y})`);
  setFly(...FLY_HOME);

  let busy = false;

  function animateAlong(points, speed, done) {
    if (INSTANT) { const [x, y] = points[points.length - 1]; setFly(x, y); done(); return; }
    // piecewise-linear path with a sinusoidal wobble
    const lens = [];
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const d = Math.hypot(points[i][0] - points[i-1][0], points[i][1] - points[i-1][1]);
      lens.push(d); total += d;
    }
    const dur = total / speed * 1000;
    const t0 = performance.now();
    (function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      let dist = t * total, i = 0;
      while (i < lens.length - 1 && dist > lens[i]) dist -= lens[i++];
      const f = lens[i] ? dist / lens[i] : 1;
      const [x1, y1] = points[i], [x2, y2] = points[i + 1];
      const x = x1 + (x2 - x1) * f, y = y1 + (y2 - y1) * f;
      const wob = Math.sin(t * 26) * 3.5 * (1 - t * 0.5);
      setFly(x, y + wob);
      if (t < 1) requestAnimationFrame(frame); else done();
    })(t0);
  }
  const wait = (ms, fn) => INSTANT ? fn() : setTimeout(fn, ms);

  const bloomCountEl = document.getElementById('bloom-count');
  const bloomTotalEl = document.getElementById('bloom-total');
  const winCountEl = document.getElementById('win-count');
  const overlay = document.getElementById('overlay');
  const btnNext = document.getElementById('btn-next');
  const levelBtnsEl = document.getElementById('level-btns');

  function launch() {
    if (busy) return;
    busy = true;
    fly.classList.add('flying');
    const idx = leverValue();
    const tip = tips[idx];
    const out = (d) => [tip.x + d * Math.sin(tip.angle), tip.y - d * Math.cos(tip.angle)];
    animateAlong([FLY_HOME, [HOLE[0] - 60, HOLE[1] - 40], HOLE], 320, () => {
      fly.style.display = 'none';               // vanished into the hollow
      wait(380, () => {                         // flying unseen inside the trunk...
        fly.style.display = '';
        // ...then bursts out of the branch tip and zooms away
        const lastSeg = tip.path[tip.path.length - 2];
        animateAlong([lastSeg, [tip.x, tip.y]], 900, () => {
          shakeTree();
          if (FLOWERS.includes(idx) && !bloomed.has(idx)) {
            bloomed.add(idx);
            flowerEls[idx].classList.add('bloom');
            bloomCountEl.textContent = bloomed.size;
          }
          animateAlong([[tip.x, tip.y], out(300)], 1100, () => {
            fly.style.display = 'none';         // gone into the sky
            wait(650, () => {
              setFly(...FLY_HOME);              // ...and back home
              fly.style.display = '';
              busy = false;
              fly.classList.remove('flying');
              if (bloomed.size === FLOWERS.length)
                wait(400, () => overlay.classList.add('show'));
            });
          });
        });
      });
    });
  }
  fly.addEventListener('click', launch);

  function shakeTree() {
    if (INSTANT) return;
    treeG.classList.remove('shake');
    void treeG.getBoundingClientRect();
    treeG.classList.add('shake');
    setTimeout(() => treeG.classList.remove('shake'), 550);
  }

  function reset() {
    bloomed.clear();
    for (const fg of Object.values(flowerEls)) fg.classList.remove('bloom');
    bloomCountEl.textContent = '0';
    overlay.classList.remove('show');
  }
  function loadLevel(i) {
    levelIdx = i;
    FLOWERS = LEVELS[i].flowers;
    buildTips();
    reset();
    bloomTotalEl.textContent = FLOWERS.length;
    winCountEl.textContent = FLOWERS.length;
    btnNext.style.display = i + 1 < LEVELS.length ? '' : 'none';
    [...levelBtnsEl.children].forEach((b, j) => b.classList.toggle('active', j === i));
  }
  document.getElementById('btn-reset').addEventListener('click', reset);
  document.getElementById('btn-again').addEventListener('click', reset);
  btnNext.addEventListener('click', () => loadLevel(Math.min(levelIdx + 1, LEVELS.length - 1)));
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button');
    b.textContent = L.name;
    b.addEventListener('click', () => loadLevel(i));
    levelBtnsEl.appendChild(b);
  });
  loadLevel(0);

  // ---- self-test: #autotest blooms every level's flowers via their codes ----
  if (INSTANT) {
    let wins = 0;
    for (let i = 0; i < LEVELS.length; i++) {
      loadLevel(i);
      for (const idx of FLOWERS) {
        bits[0] = (idx >> 3) & 1; bits[1] = (idx >> 2) & 1;
        bits[2] = (idx >> 1) & 1; bits[3] = idx & 1;
        renderLevers();
        launch();
      }
      if (bloomed.size === FLOWERS.length && overlay.classList.contains('show')) wins++;
    }
    document.body.dataset.testResult = wins === LEVELS.length
      ? 'WIN levels=' + wins
      : 'FAIL wins=' + wins;
  }
})();
</script>
</body>
</html>
